name: Build et Release MacOS

on:
  push:
    tags:
      - 'v*' # Le script se déclenchera uniquement quand vous créerez un tag (ex: v3.6.0)

jobs:
  release-mac:
    runs-on: macos-latest
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer la compilation Mac
        run: npm run dist:mac

      - name: Créer la Release et téléverser le DMG
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
