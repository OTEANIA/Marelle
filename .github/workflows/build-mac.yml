name: Build Sierra Intel et Release

on:
  push:
    tags:
      - 'v*-sierra.*'

jobs:
  release-mac:
    permissions:
      contents: write
    runs-on: macos-15-intel
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer la compilation Mac
        run: npm run dist:mac

      - name: Créer la préversion Sierra et téléverser DMG et ZIP
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
